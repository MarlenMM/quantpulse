# Section 18: "Enable Dependabot (free on public repos) for dependency
# vulnerability alerts." Three ecosystems, matching the project's three
# separately-pinned dependency sets (Section 29's "dependency pinning"):
# the Python backend (uv.lock), the React frontend (package-lock.json), and
# the GitHub Actions themselves (pinned by tag in ci.yml/refresh_data.yml).
version: 2
updates:
  # `requirements.txt` is excluded on purpose. It is *generated* from `uv.lock`
  # by `scripts/sync_requirements.py`, and exists only because Streamlit
  # Community Cloud installs from it. Left visible to Dependabot it produced one
  # PR per package bumping a pin there and nowhere else -- which
  # `tests/unit/test_deploy_requirements.py` correctly fails, since a pin that
  # disagrees with the lockfile is exactly the drift it guards. The fix belongs
  # upstream: bump `uv.lock`, which the entry below still covers, and
  # regenerate. Every dependency here is a transitive of one declared in
  # `pyproject.toml`, so nothing goes unwatched.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements.txt"
      - "app/requirements.txt"
    schedule:
      interval: "weekly"

  # Grouped (finding 40, the owner's policy). Measured on 2026-10-02: react 19.3
  # opened alone never mounted the app -- React error #527, react and react-dom
  # must be the exact same version -- while react-dom 19.3 alone and all four
  # open bumps together passed both browser suites. So React's packages always
  # move as one pull request, majors included, and every other minor or patch
  # bump arrives as one weekly pull request. Majors outside React stay separate:
  # those are the ones (Vite 7 -> 8, react-plotly.js 2 -> 4) that have blanked
  # the charts. A dependency joins the first group that matches, so React's
  # group is listed first. CI runs the static-site suite on any pull request
  # that changes the lockfile (`frontend-static` in ci.yml).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

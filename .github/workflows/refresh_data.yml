name: Data Refresh

on:
  schedule:
    # Weekday evenings, one to two hours after the New York close.
    #
    # **Run after the US close, not before.** 22:00 UTC is one to two hours
    # after the 16:00 ET close on the same calendar day in New York. Earlier
    # than that and the day's closing prices and option chain are not published
    # yet -- the database once ended up with an implied volatility of 0.46% for
    # Apple, and sub-penny values for 96% of names, from running too early.
    #
    # **The date is derived in exchange time**, not the runner's, so a run near
    # midnight UTC still stamps the New York trading day rather than tomorrow.
    # That lives in the script and needs no help from the trigger.
    #
    # **Monday's run carries the weekly branch** -- fundamentals, analyst
    # consensus, 13F, forecasts, the backtest, news and sentiment all key off
    # `_WEEKLY_REFRESH_WEEKDAY`. That is the point of scheduling weekdays rather
    # than a subset: those datasets are the ones that go stalest, and they have
    # no other way round. Measured on the two Mondays it last ran unattended
    # (2026-08-17 and 08-24), the refresh job took **3h14m** and **3h25m**
    # against GitHub's 6-hour job limit; a weekday run takes about 12 minutes.
    - cron: "0 22 * * 1-5"

  # **This was removed on 2026-08-27 and is restored deliberately.** The reason
  # given at the time was that a timer was the wrong shape for the project. The
  # reason it *looked* wrong is more specific and is now fixed: from 2026-08-10
  # the scheduled run went red thirteen nights running, and every one of those
  # failures was `publish / build`, not the refresh. The refresh job succeeded
  # each night and committed fresh data; the Pages job then failed its browser
  # gate on `getByText("AIZ")` matching six elements -- a Playwright strict-mode
  # violation in the *test*, unrelated to the data, the app, or the six-hour
  # limit the weekly branch was once suspected of.
  #
  # So the demo went stale twice over: the site stopped republishing while the
  # database kept updating, and then the timer was removed. The selector was
  # fixed (`tests-static/static-site.spec.ts` now matches the `h1` by role, with
  # a comment saying why), so the failure mode that made a nightly schedule look
  # untenable is gone rather than merely quiet.
  #
  # Manual dispatch stays, because a schedule answers "keep it current" and
  # dispatch answers the two questions a schedule cannot:
  #
  #  * catching a database up out of band, with `force_weekly` when it is not a
  #    Monday, or
  #  * finding out whether a fix to the weekly branch worked without waiting a
  #    week for Monday to tell you.
  workflow_dispatch:
    inputs:
      force_weekly:
        description: >-
          Run the weekly steps (fundamentals, analyst consensus, 13F, forecasts,
          backtest, news, sentiment) even though today is not Monday. Use this to
          catch a database up, or to find out whether a fix to the weekly branch
          worked without waiting a week for the schedule to tell you.
        type: boolean
        default: false
      ignore_market_calendar:
        description: >-
          Run even when the exchange is closed. Normally a closed day is a
          deliberate no-op; when catching up, "it is Saturday" is not a reason
          to do nothing.
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Needed to push the refreshed database back below -- the default
    # GITHUB_TOKEN is read-only unless a job explicitly asks for more.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The weekly branch runs three local models, and the two Hugging Face ones
      # -- facebook/bart-large-mnli and FinBERT -- are about 2 GB of weights
      # that were being downloaded fresh on every single run. `event_classifier`
      # already documented this cache as existing; it did not. Restored on a
      # weekly key so a stale entry cannot pin an old revision forever.
      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"

      # On a `schedule` event `inputs` is null, so both expressions collapse to
      # the empty string and the scheduled run takes the plain path: the weekly
      # branch on Mondays via the script's own weekday check, and a no-op on a
      # closed day. That is the intended behaviour rather than an oversight --
      # the flags exist to override those two defaults by hand, and a timer has
      # no business overriding either.
      - name: Run refresh
        run: >-
          uv run python scripts/refresh_data.py
          ${{ inputs.force_weekly && '--force-weekly' || '' }}
          ${{ inputs.ignore_market_calendar && '--ignore-market-calendar' || '' }}
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      # ADR 4.4: "commit/store the results" so the live app never needs
      # rate-limited API keys of its own. `quantpulse_demo.db` (not
      # `quantpulse.db` -- see .gitignore) is a repo-committed file separate
      # from anyone's local dev database, precisely so the two can never
      # collide. Safe to commit now that Phase 10's ADR 4.5 split exists: the
      # deployed app runs PORTFOLIO_BACKEND=session, so no visitor's portfolio
      # data ever lands in this shared file -- only the same screener/market
      # data every visitor already sees. `[skip ci]` skips re-running the
      # test workflow on a data-only commit; the bot identity is GitHub's
      # standard one for Actions-authored commits.
      #
      # ADR 4.4's caveat about GitHub auto-disabling a workflow after 60 days of
      # repo inactivity no longer applies -- that only ever affected `schedule:`
      # triggers, and there is none left to keep alive. The flip side is that
      # the demo database, and therefore both public deployments, are only as
      # fresh as the last time somebody dispatched this.
      #
      # `if: always()` because the refresh step exits non-zero on a hard
      # failure (so the job actually goes red instead of silently reporting
      # success for days). Whatever data did land before the failure is still
      # worth committing -- the point of the exit code is visibility, not
      # discarding a partly-successful run's work.
      - name: Commit refreshed demo database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantpulse_demo.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Data refresh [skip ci]"

          # Retry on a rejected push, replaying this run's database on top of
          # whatever landed meanwhile.
          #
          # This is not defensive decoration. The weekly branch runs for hours,
          # and a single human push during that window makes the job's own push
          # a non-fast-forward -- at which point every hour of fetching is
          # discarded and the only trace is a red job with a one-second failing
          # step. That happened: a 3h27m run that had successfully refreshed
          # fundamentals, analyst consensus, forecasts and the backtest threw all
          # of it away because a commit landed while it was working.
          #
          # Replaying rather than merging is safe *because* the database is the
          # only file this job writes and this job is the only thing that writes
          # it: take main for everything else, keep this run's data for that one
          # file. A merge would have to resolve a binary conflict with no basis
          # for choosing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt) -- main moved while this run was fetching; replaying on top of it"
            cp quantpulse_demo.db "$RUNNER_TEMP/refreshed.db"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/refreshed.db" quantpulse_demo.db
            git add quantpulse_demo.db
            if git diff --cached --quiet; then
              echo "main already carries this data."
              exit 0
            fi
            git commit -m "Data refresh [skip ci]"
          done
          echo "::error::could not push the refreshed database after 3 attempts"
          exit 1

  # Republish the public demo against the data this run just committed.
  #
  # It has to be an explicit call rather than a `push` trigger on the Pages
  # workflow: the commit above carries `[skip ci]`, which suppresses every
  # workflow that push would otherwise start. Without this the site would go on
  # serving whatever data was current the last time a human pushed code, while
  # looking perfectly healthy.
  #
  # `always()` for the same reason the commit step uses it -- a partial refresh
  # still produced data worth publishing, and the job's exit code is there for
  # visibility rather than to discard the run's work.
  #
  # `ref: main` is load-bearing. `github.sha` is fixed at whatever `main` pointed
  # at when this run started, and the refresh job commits the new database
  # *after* that -- so the default checkout would publish the previous run's
  # data every time, with every step green and nothing to notice.
  publish:
    needs: refresh
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main

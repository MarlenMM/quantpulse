name: Nightly Data Refresh

on:
  schedule:
    # 22:00 UTC = 17:00 EST / 18:00 EDT -- one to two hours after the 16:00 ET
    # close, on the SAME calendar day in New York. Moved here from 02:00 UTC,
    # which was wrong in three compounding ways:
    #
    #  * **Stale option quotes.** GitHub's scheduler routinely slips ~3 hours
    #    under load, so a 02:00 UTC job actually ran around 04:45-05:30 UTC,
    #    i.e. roughly 00:45-01:30 ET. By then Yahoo's option chain has gone
    #    stale overnight, which is how the database ended up with an implied
    #    volatility of 0.46% for Apple and sub-penny values for 96% of names.
    #  * **Friday was never captured.** At 02:00 UTC the run lands on the
    #    *previous* US evening, so Mon-Fri UTC covered Sunday through Thursday
    #    in New York. Friday's close needed a Saturday 02:00 UTC run, which
    #    `1-5` excludes. Firing at 22:00 UTC makes the UTC weekday and the ET
    #    trading day the same, so Mon-Fri means Mon-Fri.
    #  * **The date was off by one.** `run()` derived "today" from the runner's
    #    UTC clock, which at 02:00 UTC is already tomorrow in New York -- so
    #    Monday's closing data was stamped Tuesday and `is_trading_day` was
    #    asked about the wrong date. That is now fixed in the script itself
    #    (it reads the date in exchange time), and this schedule keeps the two
    #    aligned even without it.
    #
    # The script still checks the NYSE calendar, so a holiday is a cheap no-op.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Needed to push the refreshed database back below -- the default
    # GITHUB_TOKEN is read-only unless a job explicitly asks for more.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"

      - name: Run nightly refresh
        run: uv run python scripts/refresh_data.py
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      # ADR 4.4: "commit/store the results" so the live app never needs
      # rate-limited API keys of its own. `quantpulse_demo.db` (not
      # `quantpulse.db` -- see .gitignore) is a repo-committed file separate
      # from anyone's local dev database, precisely so the two can never
      # collide. Safe to commit now that Phase 10's ADR 4.5 split exists: the
      # deployed app runs PORTFOLIO_BACKEND=session, so no visitor's portfolio
      # data ever lands in this shared file -- only the same screener/market
      # data every visitor already sees. `[skip ci]` skips re-running the
      # test workflow on a data-only commit; the bot identity is GitHub's
      # standard one for Actions-authored commits. This nightly commit is
      # also what keeps the scheduled workflow itself from being
      # auto-disabled after 60 days of no repo activity (ADR 4.4's own
      # caveat) -- a side effect, not a separate thing to remember to do.
      #
      # `if: always()` because the refresh step now exits non-zero on a hard
      # failure (so the job actually goes red instead of silently reporting
      # success for days). Whatever data did land before the failure is still
      # worth committing -- the point of the exit code is visibility, not
      # discarding a partly-successful night's work.
      - name: Commit refreshed demo database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantpulse_demo.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly data refresh [skip ci]"
            git push
          fi

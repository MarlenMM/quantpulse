# Publish the read-only demo to GitHub Pages.
#
# Section 20 wants a free, always-on public link. ADR 4.4 pins the *full* app
# (Portfolio Manager, LLM narration) to Streamlit Community Cloud, which needs
# a one-time interactive sign-in nobody can automate. This is the half that can
# be automated end to end, and it costs nothing: Pages is free on public repos.
#
# Pages serves files, so the React SPA -- which is a static bundle already --
# needs its API turned into files too. `scripts/build_static_site.py` does that
# by running the real FastAPI app over the demo database (the `demo-data`
# release asset, fetched below) and writing
# every response it can produce, so the published numbers are the API's own
# output rather than a second implementation.
#
# What this deliberately does NOT publish: the Portfolio Manager. It needs
# per-visitor write state, which no static host can provide, and the API is
# read-only by design (see the module docstring in `api/main.py`).
name: Publish demo site

on:
  push:
    branches: [main]
  # Called by the nightly data refresh once it has uploaded fresh data. That
  # upload is a release asset, not a push, so the `push` trigger above never
  # fires for it -- without this call the published site would keep serving
  # whatever data was current when a human last pushed code.
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to build. The nightly passes `main`: `github.sha` is
          frozen at the commit that was current when its run was scheduled,
          and the code to build is whatever `main` holds now. (When the
          nightly still committed the database mid-run, checking out
          `github.sha` published the previous night's data every time, with
          every step green.)
        type: string
        required: false
      failure_notice:
        description: >-
          "caller" when the calling workflow reports this run's failure itself
          (the nightly does), so one failure produces one message. A string
          rather than a boolean on purpose: GitHub's `==` is loose, and an
          absent boolean input compares equal to false.
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two versions at once, and never cancel a deployment half-way:
# an interrupted Pages deploy can leave the site partly updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `inputs.ref` is empty for a push or a manual dispatch, which falls back
      # to the triggering commit -- the right thing when the point is to publish
      # what someone just pushed. See the `workflow_call` input above for why
      # the nightly has to override it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Report what is being published
        run: |
          echo "publishing $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The same command CI runs. Slower than a hand-picked subset (it pulls
      # the nightly job's ML stack, which generating JSON does not need), but
      # a hand-picked subset is a third dependency list to keep in sync, and
      # `uv.lock` is the one that is already proven.
      - name: Install dependencies
        run: uv sync --locked

      # The database is a release asset, not a committed file (it was 97.5% of
      # the repository and grew ~7.7 MB per refresh). Fetched before anything
      # that reads it, and the job fails here rather than four steps later with
      # an empty site, which is the failure mode this deploy has had before.
      - name: Fetch the demo database
        run: |
          ./scripts/fetch_demo_db.sh
          echo "demo database: $(du -h quantpulse_demo.db | cut -f1), newest scoring date $(
            sqlite3 quantpulse_demo.db 'select max(date) from composite_scores'
          )"
        env:
          GH_TOKEN: ${{ github.token }}


      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: frontend

      - name: Pre-render the API to static JSON
        run: uv run python scripts/build_static_site.py

      # A project site lives at https://<owner>.github.io/<repo>/, so every
      # asset URL and the router's path matching carry that prefix.
      - name: Build the client
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_API: "1"
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages has no SPA rewrite, so a deep link like /stocks/AAPL is a missing
      # file. Copying index.html to 404.html -- what this step used to be -- made
      # the app boot and the page render, but the *status* stayed 404, because
      # the file being served was the not-found document. Invisible to a person;
      # decisive for everything else. A crawler will not index a 404, an unfurler
      # will not preview one, so a shared stock link arrived as bare text, and an
      # uptime check reads the site as down.
      #
      # A rewrite rule is not what is needed -- the files are. This writes a real
      # index.html per route (and gives each stock page its own title and
      # description, so 503 shared links do not all preview identically), and
      # still writes 404.html for paths nothing enumerated, which genuinely are
      # not found.
      #
      # It also writes each page's link-preview card (Open Graph + Twitter tags,
      # a canonical URL, one preview image) and `sitemap.xml` -- finding 32.
      # Those need the site's absolute address, which `configure-pages` reports,
      # so it runs first and hands its `base_url` over; a fork's cards then point
      # at the fork's site rather than this one.
      - uses: actions/configure-pages@v6
        id: pages

      - name: Give every route a real page
        run: >-
          uv run python scripts/emit_route_pages.py --dist frontend/dist
          --site-url "${{ steps.pages.outputs.base_url }}"

      # The generator and the client agree about filenames only by convention:
      # they are in different languages and neither imports the other. If they
      # ever disagree, every request 404s and every page renders blank -- with
      # the type check, the build and the fixture-stubbed suite all still
      # green. This loads the artifact that is about to be published and reads
      # real numbers off it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Check the built site actually serves its data
        run: npm run test:static
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Finding 27: a failed publish on a push says so. When the nightly calls this
  # workflow it passes `failure_notice: caller` and reports the failure itself,
  # so this stays quiet then -- one failure, one message. With no webhook
  # configured the script logs one line and exits 0; the URL reaches it through
  # `env` only.
  notify:
    needs: [build, deploy]
    if: failure() && inputs.failure_notice != 'caller'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Say which job failed, and where
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > "$RUNNER_TEMP/jobs.json"
          uv run python scripts/pipeline_alert.py failure \
            --workflow "$GITHUB_WORKFLOW" --run-url "$RUN_URL" --jobs-json "$RUNNER_TEMP/jobs.json"

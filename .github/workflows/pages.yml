# Publish the read-only demo to GitHub Pages.
#
# Section 20 wants a free, always-on public link. ADR 4.4 pins the *full* app
# (Portfolio Manager, LLM narration) to Streamlit Community Cloud, which needs
# a one-time interactive sign-in nobody can automate. This is the half that can
# be automated end to end, and it costs nothing: Pages is free on public repos.
#
# Pages serves files, so the React SPA -- which is a static bundle already --
# needs its API turned into files too. `scripts/build_static_site.py` does that
# by running the real FastAPI app over the committed demo database and writing
# every response it can produce, so the published numbers are the API's own
# output rather than a second implementation.
#
# What this deliberately does NOT publish: the Portfolio Manager. It needs
# per-visitor write state, which no static host can provide, and the API is
# read-only by design (see the module docstring in `api/main.py`).
name: Publish demo site

on:
  push:
    branches: [main]
  # Called by the nightly data refresh once it has committed fresh data.
  # The nightly's own commit carries `[skip ci]`, so the `push` trigger above
  # never fires for it -- without this call the published site would keep
  # serving whatever data was current when a human last pushed code.
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to publish. The nightly must pass `main`, because it commits
          the refreshed database *during* its own run and `github.sha` is
          frozen at the commit that started it -- checking that out would
          publish the database from before the refresh, every single night,
          with every step green.
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two versions at once, and never cancel a deployment half-way:
# an interrupted Pages deploy can leave the site partly updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `inputs.ref` is empty for a push or a manual dispatch, which falls back
      # to the triggering commit -- the right thing when the point is to publish
      # what someone just pushed. See the `workflow_call` input above for why
      # the nightly has to override it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Report what is being published
        run: |
          echo "publishing $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
          echo "demo database last changed in $(git log -1 --pretty='%h %ad' --date=short -- quantpulse_demo.db)"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The same command CI runs. Slower than a hand-picked subset (it pulls
      # the nightly job's ML stack, which generating JSON does not need), but
      # a hand-picked subset is a third dependency list to keep in sync, and
      # `uv.lock` is the one that is already proven.
      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: frontend

      - name: Pre-render the API to static JSON
        run: uv run python scripts/build_static_site.py

      # A project site lives at https://<owner>.github.io/<repo>/, so every
      # asset URL and the router's path matching carry that prefix.
      - name: Build the client
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_API: "1"
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages has no SPA rewrite, so a deep link like /stocks/AAPL is a missing
      # file. Copying index.html to 404.html -- what this step used to be -- made
      # the app boot and the page render, but the *status* stayed 404, because
      # the file being served was the not-found document. Invisible to a person;
      # decisive for everything else. A crawler will not index a 404, an unfurler
      # will not preview one, so a shared stock link arrived as bare text, and an
      # uptime check reads the site as down.
      #
      # A rewrite rule is not what is needed -- the files are. This writes a real
      # index.html per route (and gives each stock page its own title and
      # description, so 503 shared links do not all preview identically), and
      # still writes 404.html for paths nothing enumerated, which genuinely are
      # not found.
      - name: Give every route a real page
        run: uv run python scripts/emit_route_pages.py --dist frontend/dist

      # The generator and the client agree about filenames only by convention:
      # they are in different languages and neither imports the other. If they
      # ever disagree, every request 404s and every page renders blank -- with
      # the type check, the build and the fixture-stubbed suite all still
      # green. This loads the artifact that is about to be published and reads
      # real numbers off it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Check the built site actually serves its data
        run: npm run test:static
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6
        id: pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

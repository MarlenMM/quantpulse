name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src scripts app

      # `tests/integration/test_ui_pages_real_data.py` renders every Streamlit
      # page against a real database and skips itself when the file is absent.
      # Now that the database is a release asset rather than a committed file,
      # not fetching it here would turn ten passing tests into ten silent skips
      # -- a green CI that stopped checking the pages.
      #
      # **The pinned copy, not the rolling one.** This step used to fetch
      # `demo-data`, which the refresh replaces five nights a week, so the test
      # job's input changed underneath it nightly. On 2026-09-15 the refresh
      # published a gutted database and three unrelated frontend pull requests
      # went red on a Streamlit test about effective weights -- a file none of
      # them had touched, with nothing on screen to say so. `ci-fixture` is
      # pinned and verified against `demo_data.CI_FIXTURE_SHA256`, so a bad
      # night can no longer fail a pull request, and if the fixture itself is
      # ever replaced without its digest being updated, *this* step fails and
      # says exactly that.
      #
      # The current data is still gated, where a failure means what it says: the
      # publish workflow runs the static-site suite against the rolling asset
      # before the demo updates, and that is what kept the gutted database off
      # the site.
      - name: Fetch the pinned test database
        run: ./scripts/fetch_demo_db.sh --ci-fixture
        env:
          GH_TOKEN: ${{ github.token }}

      # A pinned snapshot is a schema snapshot too. A migration landing in this
      # very pull request would otherwise be exercised against a database that
      # predates it -- which the rolling asset never showed, because the refresh
      # migrates it every night.
      - name: Migrate it to head
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"

      - name: Test
        run: uv run pytest

  # The React SPA is ~1,900 lines of user-facing TypeScript and had no gate at
  # all: CI ran only the Python steps above, so a type error or a broken build
  # in `frontend/` reached main unnoticed, and a Dependabot bump to a frontend
  # dependency was "checked" by a job that never installed it. This is the same
  # gap that left `app/` un-type-checked until it was added to mypy -- a whole
  # tree of shipped code outside every gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, so the committed lockfile is what
      # gets built -- the same discipline `uv sync --locked` enforces above.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The static checks above cannot see a failed dynamic import: two
      # charting regressions shipped straight through them (a Vite 8 CommonJS
      # interop change, then react-plotly.js 4 shipping a forwardRef object),
      # each leaving every chart page blank while type-check and build stayed
      # green. These load the real built bundle in a real browser, which is the
      # only thing that reproduces either.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Runtime tests
        run: npm run test:e2e

      - name: Audit
        run: npm audit --audit-level=high

  # The static-site suite, on pull requests that change the frontend's
  # dependencies (finding 40, the owner's policy). The e2e suite above stubs the
  # API from a fixture; this one pre-renders a real database and checks, among
  # other things, that every Plotly figure drew the trace type it asked for --
  # the failure that has blanked the charts with every other check green. It
  # used to run only in the publish workflow, i.e. after a merge, where a break
  # shows up as a failed publish and a demo left on the old build.
  #
  # The pinned CI database, as the test job uses, so a bad night's data cannot
  # fail a dependency pull request. A pull request that leaves the dependency
  # files alone skips every step after the check and costs nothing.
  frontend-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did this pull request change the frontend's dependencies?
        id: deps
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- frontend/package.json frontend/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to the frontend's dependencies; nothing to check here."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.deps.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.deps.outputs.changed == 'true'
        run: uv sync --locked

      - name: Fetch the pinned test database
        if: steps.deps.outputs.changed == 'true'
        run: ./scripts/fetch_demo_db.sh --ci-fixture
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Migrate it to head
        if: steps.deps.outputs.changed == 'true'
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: "sqlite:///./quantpulse_demo.db"

      - uses: actions/setup-node@v7
        if: steps.deps.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install client dependencies
        if: steps.deps.outputs.changed == 'true'
        run: npm ci
        working-directory: frontend

      - name: Pre-render the API to static JSON
        if: steps.deps.outputs.changed == 'true'
        run: uv run python scripts/build_static_site.py

      - name: Build the client
        if: steps.deps.outputs.changed == 'true'
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_API: "1"

      - name: Give every route a real page
        if: steps.deps.outputs.changed == 'true'
        run: uv run python scripts/emit_route_pages.py --dist frontend/dist

      - name: Install Playwright browser
        if: steps.deps.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Check the built site against real data
        if: steps.deps.outputs.changed == 'true'
        run: npm run test:static
        working-directory: frontend

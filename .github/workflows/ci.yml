name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src scripts app

      - name: Test
        run: uv run pytest

  # The React SPA is ~1,900 lines of user-facing TypeScript and had no gate at
  # all: CI ran only the Python steps above, so a type error or a broken build
  # in `frontend/` reached main unnoticed, and a Dependabot bump to a frontend
  # dependency was "checked" by a job that never installed it. This is the same
  # gap that left `app/` un-type-checked until it was added to mypy -- a whole
  # tree of shipped code outside every gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, so the committed lockfile is what
      # gets built -- the same discipline `uv sync --locked` enforces above.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src scripts app

      # `tests/integration/test_ui_pages_real_data.py` renders every Streamlit
      # page against the real database and skips itself when the file is
      # absent. Now that the database is a release asset rather than a
      # committed file, not fetching it here would turn ten passing tests into
      # ten silent skips -- a green CI that stopped checking the pages.
      - name: Fetch the demo database
        run: ./scripts/fetch_demo_db.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test
        run: uv run pytest

  # The React SPA is ~1,900 lines of user-facing TypeScript and had no gate at
  # all: CI ran only the Python steps above, so a type error or a broken build
  # in `frontend/` reached main unnoticed, and a Dependabot bump to a frontend
  # dependency was "checked" by a job that never installed it. This is the same
  # gap that left `app/` un-type-checked until it was added to mypy -- a whole
  # tree of shipped code outside every gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, so the committed lockfile is what
      # gets built -- the same discipline `uv sync --locked` enforces above.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The static checks above cannot see a failed dynamic import: two
      # charting regressions shipped straight through them (a Vite 8 CommonJS
      # interop change, then react-plotly.js 4 shipping a forwardRef object),
      # each leaving every chart page blank while type-check and build stayed
      # green. These load the real built bundle in a real browser, which is the
      # only thing that reproduces either.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Runtime tests
        run: npm run test:e2e

      - name: Audit
        run: npm audit --audit-level=high

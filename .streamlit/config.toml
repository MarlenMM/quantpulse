# Dark mode by default (Section 31: "cheap, and a nice touch for a live demo
# viewed at night"). Streamlit's own theme toggle still lets a visitor switch;
# the Plotly figures use transparent backgrounds so they follow either way.
[theme]
base = "dark"
primaryColor = "#3b82f6"

[server]
# "auto" watches Python sources only, which is what we want: a refresh now runs
# as a subprocess of this app and writes the database underneath it, and having
# the app reload itself mid-write would buy nothing. Fresh rows reach the pages
# by the refresh clearing `lib.data`'s caches when it finishes, not by a watcher.
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

# Hooks run via `uv run` against the project's own locked versions
# (pyproject.toml / uv.lock) instead of pre-commit's separate hook envs,
# so local checks and CI never drift out of sync.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      # `app` is checked alongside `src`/`scripts` because it is not a thin
      # view layer -- it is ~2,800 lines of the code a user actually looks at,
      # and it was the one tree with no type gate at all. `tests` stays out on
      # purpose (see CONTRIBUTING.md): test files compare Optional values
      # directly without narrowing, which is a deliberate, readable pattern
      # there and not worth silencing case by case.
      - id: mypy
        name: mypy
        entry: uv run mypy src scripts app
        language: system
        types: [python]
        pass_filenames: false
